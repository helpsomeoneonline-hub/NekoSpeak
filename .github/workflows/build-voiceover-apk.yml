name: Build NekoSpeak Voiceover APK

on:
  push:
    branches:
      - main
      - feature/voiceover-wav-export
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set standalone APK identity
        shell: bash
        run: |
          # The fork keeps original engine source and namespace, but the APK
          # installs beside upstream NekoSpeak instead of overwriting it.
          sed -i 's/applicationId = "com.nekospeak.tts"/applicationId = "com.nekospeak.tts.voiceover"/' app/build.gradle.kts
          sed -i 's/versionCode = 16/versionCode = 17/' app/build.gradle.kts
          sed -i 's/versionName = "1.4.2"/versionName = "1.4.3-voiceover"/' app/build.gradle.kts

      - name: Build debug APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: NekoSpeak-Voiceover-APKs
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3
